version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3000:3000"
    volumes:
      - khaodee-data:/app/data
    environment:
      KHAODEE_DB_PATH: /app/data/khaodee.db
      PORT: "3000"
    restart: unless-stopped

volumes:
  khaodee-data:
